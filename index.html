<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job-In — Tu próximo éxito laboral se encuentra aquí</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05080A; --bg-1:#0B0F12; --bg-2:#10151A; --carbon:#14181B;
  --card: rgba(255,255,255,0.035); --card-hover: rgba(255,255,255,0.06);
  --border: rgba(255,255,255,0.09); --border-strong: rgba(255,255,255,0.18);
  --accent:#C6FF00; --accent-2:#9FE000; --accent-dim: rgba(198,255,0,0.12); --accent-glow: rgba(198,255,0,0.28);
  --white:#FFFFFF; --gray:#A9B2B8; --gray-dim:#71797E;
  --radius:16px; --radius-sm:10px; --radius-lg:22px;
  --font-d:'Space Grotesk', system-ui, sans-serif; --font-b:'Manrope', system-ui, sans-serif;
  --danger:#FF6B6B; --warn:#FFC857; --ok:#5CCE7C;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#05080A; --white:#FFFFFF; } }
:root[data-theme="dark"]{ --bg:#05080A; --white:#FFFFFF; }
*{box-sizing:border-box; margin:0; padding:0;}
html{-webkit-text-size-adjust:100%; scroll-behavior:smooth;}
body{background:var(--bg); color:var(--white); font-family:var(--font-b); line-height:1.55; min-height:100vh; overflow-x:hidden;}
a{color:inherit; text-decoration:none;}
button,input,select,textarea{font-family:inherit; font-size:inherit; color:inherit;}
button{cursor:pointer;}
img{max-width:100%; display:block;}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
::selection{background:var(--accent); color:#05080A;}
.wrap{max-width:1280px; margin:0 auto; padding:0 28px;}
h1,h2,h3,h4{font-family:var(--font-d); font-weight:600; letter-spacing:-0.01em;}

/* scrollbar */
::-webkit-scrollbar{width:10px; height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:8px;}

/* ---------- utility ---------- */
.glass{ background:var(--card); border:1px solid var(--border); border-radius:var(--radius); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.glass:hover{ border-color:var(--border-strong); }
.btn{ font-family:var(--font-d); font-weight:600; border-radius:10px; border:none; padding:12px 22px; font-size:0.92rem; display:inline-flex; align-items:center; gap:8px; transition: transform .12s ease, box-shadow .18s ease, opacity .15s ease, background .15s ease; white-space:nowrap;}
.btn:active{ transform:scale(0.97); }
.btn-primary{ background:linear-gradient(135deg, var(--accent), var(--accent-2)); color:#05080A; box-shadow:0 0 0 rgba(198,255,0,0); }
.btn-primary:hover{ box-shadow:0 4px 24px var(--accent-glow); }
.btn-ghost{ background:transparent; border:1px solid var(--border-strong); color:var(--white); }
.btn-ghost:hover{ border-color:var(--accent); color:var(--accent); }
.btn-sm{ padding:8px 14px; font-size:0.82rem; border-radius:8px; }
.btn-full{ width:100%; justify-content:center; }
.btn-danger{ background:transparent; border:1px solid rgba(255,107,107,0.4); color:var(--danger); }
.btn-danger:hover{ background:rgba(255,107,107,0.1); }
.btn[disabled]{ opacity:0.45; cursor:not-allowed; }
.tag{ display:inline-flex; align-items:center; gap:5px; border:1px solid var(--border-strong); border-radius:999px; padding:5px 12px; font-size:0.78rem; color:var(--gray); }
.badge-verified{ display:inline-flex; align-items:center; gap:4px; color:var(--accent); font-size:0.76rem; font-weight:700; }
.pill{ background:var(--accent-dim); color:var(--accent); border-radius:999px; padding:4px 10px; font-size:0.74rem; font-weight:700; }
.muted{ color:var(--gray); }
.row{ display:flex; align-items:center; }
.between{ justify-content:space-between; }
.gap8{gap:8px;} .gap12{gap:12px;} .gap16{gap:16px;} .gap24{gap:24px;}
.section{ padding:56px 0; }
.section-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:22px; flex-wrap:wrap; gap:10px; }
.icon{ display:inline-flex; flex-shrink:0; }
.hidden{ display:none !important; }
.field label{ display:block; font-size:0.82rem; color:var(--gray); margin-bottom:7px; font-weight:600;}
.field input, .field select, .field textarea{
  width:100%; background:var(--bg-1); border:1px solid var(--border-strong); color:var(--white);
  padding:11px 13px; border-radius:9px; resize:vertical;
}
.field input:focus, .field select:focus, .field textarea:focus{ border-color:var(--accent); }
.field-note{ font-size:0.76rem; color:var(--gray-dim); margin-top:4px; }
.grid2{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.grid3{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
.grid4{ display:grid; grid-template-columns:repeat(4,1fr); gap:16px; }
.checkline{ display:flex; align-items:center; gap:8px; font-size:0.86rem; padding:5px 0; color:var(--gray); }
.checkline input{ accent-color:var(--accent); width:15px; height:15px; }
.divider{ height:1px; background:var(--border); margin:20px 0; border:none; }

/* ---------- glow blob bg ---------- */
.glow-bg{ position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
.glow-bg span{ position:absolute; border-radius:50%; filter:blur(120px); opacity:0.16; background:var(--accent); }
.glow-bg span:nth-child(1){ width:520px; height:520px; top:-180px; left:-120px; }
.glow-bg span:nth-child(2){ width:420px; height:420px; bottom:-160px; right:-80px; opacity:0.10; }

/* ---------- topbar public ---------- */
header.pub{ position:sticky; top:0; z-index:80; background:rgba(5,8,10,0.85); backdrop-filter:blur(14px); border-bottom:1px solid var(--border); }
.pub-inner{ display:flex; align-items:center; justify-content:space-between; padding:14px 0; gap:20px; }
.logo-img{ height:34px; width:auto; }
.logo-icon-img{ height:30px; width:auto; }
nav.pub-nav{ display:flex; gap:28px; }
nav.pub-nav a{ font-size:0.92rem; color:var(--gray); font-weight:600; transition:color .15s ease; position:relative; padding:4px 0;}
nav.pub-nav a:hover, nav.pub-nav a.active{ color:var(--white); }
nav.pub-nav a.active::after{ content:''; position:absolute; left:0; right:0; bottom:-6px; height:2px; background:var(--accent); border-radius:2px; }
.pub-actions{ display:flex; align-items:center; gap:10px; }
.mobile-toggle{ display:none; background:transparent; border:1px solid var(--border-strong); border-radius:8px; padding:8px; }

/* ---------- app chrome (logged-in) ---------- */
.app-shell{ display:flex; min-height:100vh; }
aside.sidebar{
  width:246px; flex-shrink:0; background:var(--bg-1); border-right:1px solid var(--border);
  position:sticky; top:0; height:100vh; overflow-y:auto; overflow-x:hidden; padding:22px 16px; display:flex; flex-direction:column; z-index:70;
  transition:width .18s ease, padding .18s ease;
}
.side-logo{ padding:6px 10px 22px; display:flex; align-items:center; justify-content:space-between; gap:8px; }
.side-logo img{ transition:opacity .15s ease; }
.side-collapse-btn{ background:transparent; border:1px solid var(--border-strong); border-radius:7px; padding:6px; color:var(--gray); flex-shrink:0; }
.side-collapse-btn:hover{ border-color:var(--accent); color:var(--accent); }
.side-drawer-close{ display:none; background:transparent; border:1px solid var(--border-strong); border-radius:7px; padding:6px; color:var(--gray); }
.side-nav{ display:flex; flex-direction:column; gap:3px; flex:1; }
.side-link{ display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:9px; color:var(--gray); font-size:0.88rem; font-weight:600; transition:background .15s ease, color .15s ease; white-space:nowrap; }
.side-link .icon{ opacity:0.8; flex-shrink:0; }
.side-link:hover{ background:var(--card-hover); color:var(--white); }
.side-link.active{ background:var(--accent-dim); color:var(--accent); }
.side-link.active .icon{ opacity:1; }
.side-foot{ border-top:1px solid var(--border); padding-top:14px; margin-top:10px; }
.side-label, .side-foot .user-name-block, .side-foot .btn-label{ transition:opacity .1s ease; }

/* collapsed (desktop icon rail) */
aside.sidebar.collapsed{ width:78px; padding:22px 10px; }
aside.sidebar.collapsed .side-logo{ justify-content:center; }
aside.sidebar.collapsed .side-logo img{ display:none; }
aside.sidebar.collapsed .side-link{ justify-content:center; padding:10px; }
aside.sidebar.collapsed .side-label{ display:none; }
aside.sidebar.collapsed .side-foot .user-name-block{ display:none; }
aside.sidebar.collapsed .side-foot .row.gap12{ justify-content:center; }
aside.sidebar.collapsed .side-foot .btn-label{ display:none; }

/* public mobile nav drawer — hidden off-canvas at all screen sizes until opened */
aside.sidebar.pub-drawer{
  position:fixed; left:0; top:0; width:246px; transform:translateX(-100%);
  transition:transform .2s ease; box-shadow:20px 0 60px rgba(0,0,0,0.5); z-index:130;
}
aside.sidebar.pub-drawer.open{ transform:translateX(0); }

.app-main{ flex:1; min-width:0; }
header.app-top{ position:sticky; top:0; z-index:60; background:rgba(5,8,10,0.9); backdrop-filter:blur(14px); border-bottom:1px solid var(--border); }
.apptop-inner{ display:flex; align-items:center; gap:16px; padding:14px 28px; }
.apptop-search{ flex:1; display:flex; align-items:center; gap:10px; background:var(--bg-1); border:1px solid var(--border-strong); border-radius:10px; padding:9px 14px; max-width:520px; }
.apptop-search input{ background:transparent; border:none; outline:none; color:var(--white); width:100%; }
.apptop-icons{ display:flex; align-items:center; gap:6px; margin-left:auto; }
.icon-btn{ position:relative; background:transparent; border:1px solid transparent; border-radius:9px; padding:9px; color:var(--gray); }
.icon-btn:hover{ background:var(--card-hover); color:var(--white); }
.icon-dot{ position:absolute; top:5px; right:5px; width:8px; height:8px; border-radius:50%; background:var(--accent); border:2px solid var(--bg); }
.user-chip{ display:flex; align-items:center; gap:9px; padding:6px 10px 6px 6px; border-radius:999px; border:1px solid var(--border-strong); background:var(--bg-1); }
.avatar{ width:30px; height:30px; border-radius:50%; background:linear-gradient(135deg,var(--accent),#7fae00); display:flex; align-items:center; justify-content:center; font-family:var(--font-d); font-weight:700; font-size:0.78rem; color:#05080A; flex-shrink:0; }
.avatar.lg{ width:64px; height:64px; font-size:1.3rem; }
.content-pad{ padding:28px; max-width:1240px; }

/* ---------- hero ---------- */
.hero{ padding:76px 0 56px; position:relative; }
.hero-grid{ display:grid; grid-template-columns:1.05fr 0.95fr; gap:48px; align-items:center; }
.hero h1{ font-size:clamp(2.2rem,4vw,3.4rem); line-height:1.06; }
.hero h1 .lime{ color:var(--accent); }
.hero p.lede{ margin-top:18px; color:var(--gray); font-size:1.08rem; max-width:46ch; }
.hero-visual{ border-radius:var(--radius-lg); overflow:hidden; border:1px solid var(--border); position:relative; aspect-ratio:4/3; background:linear-gradient(160deg,#0d1710,#05080A 60%); }
.hero-visual svg{ width:100%; height:100%; }

.search-panel{ margin-top:34px; padding:16px; display:flex; gap:10px; flex-wrap:wrap; }
.search-panel .field{ flex:1; min-width:180px; }
.search-panel .field.loc{ flex:0.7; min-width:160px; }
.search-panel .field.cat{ flex:0.8; min-width:170px; }

.cat-strip{ display:flex; gap:10px; flex-wrap:wrap; margin-top:20px; }
.cat-pill{ display:flex; align-items:center; gap:8px; padding:9px 16px; border-radius:999px; border:1px solid var(--border-strong); font-size:0.85rem; color:var(--gray); background:var(--bg-1); transition:.15s; }
.cat-pill:hover{ border-color:var(--accent); color:var(--white); }

/* stats banner */
.stats-banner{ display:grid; grid-template-columns:repeat(4,1fr); gap:16px; padding:32px 0; }
.stat-box{ padding:22px; text-align:center; }
.stat-box .num{ font-family:var(--font-d); font-size:1.9rem; font-weight:700; color:var(--accent); }
.stat-box .lbl{ color:var(--gray); font-size:0.84rem; margin-top:4px; }

.cta-banner{ padding:38px 32px; display:flex; align-items:center; justify-content:space-between; gap:24px; flex-wrap:wrap; background:linear-gradient(120deg, rgba(198,255,0,0.09), transparent 60%), var(--card); border:1px solid var(--border); border-radius:var(--radius-lg); }
.cta-banner h3{ font-size:1.5rem; line-height:1.25; }
.cta-banner h3 .lime{ color:var(--accent); }

/* ---------- job cards ---------- */
.job-grid{ display:grid; grid-template-columns:1fr; gap:12px; }
.job-grid.cols2{ grid-template-columns:1fr 1fr; }
.job-card{ padding:20px 22px; cursor:pointer; transition:border-color .15s ease, transform .15s ease, box-shadow .2s ease; }
.job-card:hover{ border-color:var(--accent); box-shadow:0 8px 32px rgba(0,0,0,0.35); transform:translateY(-2px); }
.job-card-top{ display:flex; gap:14px; }
.job-logo{ width:46px; height:46px; border-radius:12px; background:var(--carbon); display:flex; align-items:center; justify-content:center; font-family:var(--font-d); font-weight:700; color:var(--accent); flex-shrink:0; border:1px solid var(--border); }
.job-card .role{ font-family:var(--font-d); font-weight:600; font-size:1.06rem; }
.job-card .company-line{ display:flex; align-items:center; gap:6px; color:var(--gray); font-size:0.86rem; margin-top:3px; }
.job-card .match{ margin-left:auto; text-align:right; flex-shrink:0; }
.match-value{ font-family:var(--font-d); font-weight:700; color:var(--accent); font-size:1.15rem; }
.match-label{ font-size:0.7rem; color:var(--gray-dim); }
.job-meta{ display:flex; flex-wrap:wrap; gap:8px 16px; margin-top:14px; font-size:0.82rem; color:var(--gray); }
.job-meta span{ display:flex; align-items:center; gap:6px; }
.job-salary{ margin-top:12px; font-family:var(--font-d); font-weight:600; color:var(--white); font-size:0.95rem; }
.job-tags{ display:flex; gap:6px; flex-wrap:wrap; margin-top:12px; }
.job-card-actions{ display:flex; gap:8px; margin-top:16px; }

/* ---------- search / filters layout ---------- */
.search-layout{ display:grid; grid-template-columns:260px 1fr; gap:24px; align-items:start; }
.filters-panel{ padding:20px; position:sticky; top:88px; max-height:calc(100vh - 110px); overflow-y:auto; }
.filters-panel h4{ font-size:0.95rem; margin-bottom:2px; }
.filter-group{ padding:14px 0; border-bottom:1px solid var(--border); }
.filter-group:last-child{ border-bottom:none; }
.filter-group summary{ cursor:pointer; font-weight:700; font-size:0.86rem; list-style:none; display:flex; justify-content:space-between; align-items:center; }
.filter-group summary::-webkit-details-marker{ display:none; }
.filter-group[open] summary .chevron{ transform:rotate(180deg); }
.filter-group-body{ padding-top:10px; }
.results-toolbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:10px; }
.filter-toggle-btn{ display:none; }

/* ---------- dashboard cards ---------- */
.dash-top{ display:grid; grid-template-columns:1.4fr 1fr; gap:16px; margin-bottom:16px; align-items:stretch;}
.welcome-card{ padding:26px; }
.welcome-card h2{ font-size:1.5rem; }
.progress-ring-wrap{ display:flex; align-items:center; gap:18px; padding:20px; }
.ring{ position:relative; width:78px; height:78px; flex-shrink:0; }
.ring svg{ transform:rotate(-90deg); width:100%; height:100%; }
.ring .ring-num{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:var(--font-d); font-weight:700; font-size:1rem; }
.match-explain{ margin-top:16px; display:flex; flex-direction:column; gap:8px; }
.match-explain .ok-line{ display:flex; gap:8px; align-items:flex-start; font-size:0.86rem; color:var(--gray); }
.match-explain .ok-line .icon{ color:var(--accent); margin-top:2px; }
.activity-list{ display:flex; flex-direction:column; }
.activity-item{ display:flex; gap:12px; padding:13px 0; border-bottom:1px solid var(--border); font-size:0.87rem; }
.activity-item:last-child{ border-bottom:none; }
.activity-dot{ width:8px; height:8px; border-radius:50%; background:var(--accent); margin-top:6px; flex-shrink:0; }
.activity-time{ color:var(--gray-dim); font-size:0.76rem; margin-top:2px; }

/* kpi cards company */
.kpi-card{ padding:20px; }
.kpi-card .num{ font-family:var(--font-d); font-size:1.7rem; font-weight:700; }
.kpi-card .lbl{ color:var(--gray); font-size:0.83rem; margin-top:4px; }
.kpi-card .delta{ font-size:0.76rem; color:var(--accent); margin-top:6px; }

/* ---------- tabs ---------- */
.tabs{ display:flex; gap:6px; background:var(--bg-1); border:1px solid var(--border); border-radius:10px; padding:4px; width:fit-content; flex-wrap:wrap; }
.tab-btn{ background:transparent; border:none; padding:8px 16px; border-radius:7px; font-size:0.85rem; font-weight:600; color:var(--gray); }
.tab-btn.active{ background:var(--accent); color:#05080A; }

/* ---------- profile ---------- */
.profile-head{ display:flex; gap:20px; align-items:center; padding:26px; flex-wrap:wrap; }
.profile-block{ padding:22px; margin-bottom:16px; }
.profile-block h4{ display:flex; align-items:center; gap:8px; font-size:1.02rem; margin-bottom:14px; }
.exp-item{ padding:12px 0; border-bottom:1px solid var(--border); }
.exp-item:last-child{ border-bottom:none; }
.exp-item .t1{ font-weight:700; }
.exp-item .t2{ color:var(--accent); font-size:0.85rem; }
.exp-item .t3{ color:var(--gray-dim); font-size:0.78rem; margin-top:2px; }
.skill-chip{ display:inline-block; background:var(--card); border:1px solid var(--border-strong); border-radius:999px; padding:6px 14px; font-size:0.8rem; margin:0 6px 6px 0; }

/* ---------- applications timeline ---------- */
.app-card{ padding:18px 20px; margin-bottom:10px; }
.status-badge{ font-size:0.74rem; font-weight:700; padding:4px 11px; border-radius:999px; }
.status-enviada, .status-nuevas{ background:rgba(169,178,184,0.15); color:var(--gray); }
.status-en-revision{ background:rgba(255,200,87,0.15); color:var(--warn); }
.status-vista, .status-preseleccionado{ background:rgba(120,180,255,0.15); color:#78B4FF; }
.status-entrevista{ background:var(--accent-dim); color:var(--accent); }
.status-seleccionado, .status-contratado{ background:rgba(92,206,124,0.15); color:#5CCE7C; }
.status-no-seleccionado{ background:rgba(255,107,107,0.15); color:var(--danger); }
.timeline{ display:flex; align-items:center; margin-top:14px; }
.tl-step{ flex:1; text-align:center; position:relative; }
.tl-dot{ width:12px; height:12px; border-radius:50%; background:var(--border-strong); margin:0 auto 6px; position:relative; z-index:2; }
.tl-step.done .tl-dot{ background:var(--accent); box-shadow:0 0 10px var(--accent-glow); }
.tl-line{ position:absolute; top:5px; left:-50%; width:100%; height:2px; background:var(--border-strong); z-index:1; }
.tl-step.done .tl-line{ background:var(--accent); }
.tl-step:first-child .tl-line{ display:none; }
.tl-label{ font-size:0.68rem; color:var(--gray-dim); }
.tl-step.done .tl-label{ color:var(--gray); }

/* ---------- messages ---------- */
.msg-layout{ display:grid; grid-template-columns:280px 1fr; height:calc(100vh - 130px); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; }
.thread-list{ border-right:1px solid var(--border); overflow-y:auto; background:var(--bg-1); }
.thread-item{ display:flex; gap:11px; padding:14px 16px; border-bottom:1px solid var(--border); align-items:center; }
.thread-item:hover, .thread-item.active{ background:var(--card-hover); }
.thread-item .name{ font-weight:700; font-size:0.9rem; }
.thread-item .preview{ font-size:0.78rem; color:var(--gray-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:170px; }
.chat-col{ display:flex; flex-direction:column; }
.chat-head{ padding:14px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:12px; }
.chat-body{ flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:12px; }
.bubble{ max-width:62%; padding:11px 15px; border-radius:14px; font-size:0.87rem; }
.bubble.me{ align-self:flex-end; background:var(--accent); color:#05080A; border-bottom-right-radius:4px; }
.bubble.them{ align-self:flex-start; background:var(--bg-1); border:1px solid var(--border); border-bottom-left-radius:4px; }
.bubble .time{ display:block; font-size:0.68rem; opacity:0.6; margin-top:4px; }
.chat-input{ display:flex; gap:10px; padding:14px 18px; border-top:1px solid var(--border); }
.chat-input input{ flex:1; background:var(--bg-1); border:1px solid var(--border-strong); border-radius:10px; padding:11px 14px; color:var(--white); }

/* ---------- notifications ---------- */
.notif-item{ display:flex; gap:14px; padding:16px 18px; margin-bottom:8px; align-items:flex-start; }
.notif-item.unread{ border-color:var(--accent); }
.notif-icon{ width:38px; height:38px; border-radius:10px; background:var(--accent-dim); display:flex; align-items:center; justify-content:center; color:var(--accent); flex-shrink:0; }
.notif-text{ font-size:0.89rem; }
.notif-time{ font-size:0.75rem; color:var(--gray-dim); margin-top:3px; }

/* ---------- kanban ---------- */
.kanban{ display:grid; grid-template-columns:repeat(6,1fr); gap:12px; overflow-x:auto; }
.kb-col{ background:var(--bg-1); border:1px solid var(--border); border-radius:var(--radius); padding:12px; min-width:200px; }
.kb-col h5{ font-size:0.82rem; margin-bottom:10px; display:flex; justify-content:space-between; color:var(--gray); }
.kb-card{ padding:12px; margin-bottom:9px; cursor:grab; }
.kb-card:active{ cursor:grabbing; }
.kb-card .name{ font-weight:700; font-size:0.86rem; }
.kb-card .role{ font-size:0.76rem; color:var(--gray-dim); margin-top:2px; }
.kb-card .move-row{ display:flex; gap:5px; margin-top:9px; }
.kb-card .move-row button{ flex:1; background:var(--bg-2); border:1px solid var(--border-strong); border-radius:6px; padding:4px; font-size:0.7rem; color:var(--gray); }
.kb-card .move-row button:hover{ border-color:var(--accent); color:var(--accent); }

/* ---------- candidates table ---------- */
.cand-row{ display:grid; grid-template-columns:2fr 1fr 1fr 1fr auto; gap:14px; align-items:center; padding:16px 18px; margin-bottom:10px; }
.cand-info{ display:flex; align-items:center; gap:12px; }
.cand-info .name{ font-weight:700; font-size:0.92rem; }
.cand-info .role{ font-size:0.8rem; color:var(--gray-dim); }

/* ---------- CV builder ---------- */
.cv-layout{ display:grid; grid-template-columns:1fr 1fr; gap:20px; align-items:start; }
.cv-preview{ padding:34px; background:#0c0f11; border:1px solid var(--border); border-radius:var(--radius); }
.cv-preview .pname{ font-family:var(--font-d); font-size:1.5rem; font-weight:700; }
.cv-preview .prole{ color:var(--accent); font-size:0.95rem; margin-top:2px; }
.cv-preview h5{ font-size:0.78rem; text-transform:uppercase; letter-spacing:0.06em; color:var(--gray-dim); margin:18px 0 8px; border-bottom:1px solid var(--border); padding-bottom:6px; }
.cv-list-item{ display:flex; justify-content:space-between; gap:10px; margin-bottom:8px; }
.cv-editor-item{ padding:14px; margin-bottom:10px; }

/* ---------- charts (custom, css-based) ---------- */
.bars{ display:flex; align-items:flex-end; gap:14px; height:180px; padding:16px 6px 0; }
.bar-col{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; }
.bar-fill{ width:100%; max-width:34px; background:linear-gradient(180deg, var(--accent), rgba(198,255,0,0.25)); border-radius:6px 6px 0 0; }
.bar-lbl{ font-size:0.7rem; color:var(--gray-dim); margin-top:8px; text-align:center; }
.hbars{ display:flex; flex-direction:column; gap:12px; }
.hbar-row{ display:grid; grid-template-columns:120px 1fr 40px; gap:10px; align-items:center; font-size:0.8rem; }
.hbar-track{ height:9px; background:var(--bg-1); border-radius:6px; overflow:hidden; }
.hbar-fill{ height:100%; background:var(--accent); border-radius:6px; }

/* ---------- login/register ---------- */
.auth-wrap{ min-height:calc(100vh - 70px); display:flex; align-items:center; justify-content:center; padding:48px 20px; }
.auth-card{ max-width:440px; width:100%; padding:34px; }
.role-switch{ display:flex; gap:8px; background:var(--bg-1); border:1px solid var(--border); border-radius:10px; padding:4px; margin-bottom:22px; }
.role-switch button{ flex:1; background:transparent; border:none; padding:10px; border-radius:7px; font-weight:700; font-size:0.85rem; color:var(--gray); }
.role-switch button.active{ background:var(--accent); color:#05080A; }
.pw-field{ position:relative; }
.pw-toggle{ position:absolute; right:12px; top:38px; background:transparent; border:none; color:var(--gray-dim); font-size:0.76rem; font-weight:700; }
.checkrow{ display:flex; justify-content:space-between; align-items:center; margin:6px 0 18px; font-size:0.83rem; color:var(--gray); }
.checkrow label{ display:flex; align-items:center; gap:7px; }

/* ---------- toast / empty state ---------- */
.toast{ position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(24px); background:var(--accent); color:#05080A; font-family:var(--font-d); font-weight:700; padding:13px 24px; border-radius:10px; font-size:0.88rem; opacity:0; pointer-events:none; transition:.25s ease; z-index:400; box-shadow:0 10px 40px rgba(0,0,0,0.4);}
.toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
.empty-state{ padding:60px 24px; text-align:center; color:var(--gray); }
.empty-state .icon{ color:var(--accent); margin-bottom:14px; }
.empty-state strong{ display:block; color:var(--white); font-family:var(--font-d); font-size:1.1rem; margin-bottom:6px; }
.skeleton{ background:linear-gradient(90deg, var(--card) 25%, var(--card-hover) 50%, var(--card) 75%); background-size:200% 100%; animation:shimmer 1.4s infinite; border-radius:var(--radius); }
@keyframes shimmer{ 0%{background-position:200% 0;} 100%{background-position:-200% 0;} }

/* ---------- job detail ---------- */
.jd-head{ padding:28px; }
.jd-info-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin:20px 0; }
.jd-info-box{ padding:16px; }
.jd-info-box .k{ font-size:0.72rem; text-transform:uppercase; letter-spacing:0.06em; color:var(--gray-dim); margin-bottom:4px; }
.jd-info-box .v{ font-family:var(--font-d); font-weight:700; }
.jd-body{ display:grid; grid-template-columns:1.6fr 1fr; gap:20px; margin-top:20px; align-items:start; }
.jd-block{ padding:24px; margin-bottom:16px; }
.jd-block h4{ margin-bottom:12px; }
.jd-block ul{ padding-left:20px; color:var(--gray); font-size:0.9rem; display:flex; flex-direction:column; gap:6px; }
.sticky-apply{ position:sticky; top:88px; }

/* ---------- footer ---------- */
footer.pub-footer{ border-top:1px solid var(--border); padding:44px 0 28px; margin-top:40px; }
.foot-grid{ display:grid; grid-template-columns:1.4fr repeat(3,1fr); gap:32px; margin-bottom:32px; }
.foot-grid h5{ font-size:0.85rem; margin-bottom:12px; }
.foot-grid a{ display:block; color:var(--gray); font-size:0.85rem; padding:5px 0; }
.foot-grid a:hover{ color:var(--accent); }
.foot-bottom{ display:flex; justify-content:space-between; color:var(--gray-dim); font-size:0.8rem; flex-wrap:wrap; gap:10px; border-top:1px solid var(--border); padding-top:20px; }

/* ---------- mobile ---------- */
.mobile-drawer-overlay{ position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:120; display:none; }
.mobile-drawer-overlay.show{ display:block; }
@media (max-width: 980px){
  aside.sidebar{ position:fixed; left:0; top:0; width:246px !important; padding:22px 16px !important; transform:translateX(-100%); transition:transform .2s ease; box-shadow:20px 0 60px rgba(0,0,0,0.5);}
  aside.sidebar.open{ transform:translateX(0); }
  aside.sidebar .side-label, aside.sidebar .side-foot .user-name-block, aside.sidebar .side-foot .btn-label{ display:inline !important; }
  aside.sidebar .side-logo img{ display:block !important; }
  .side-collapse-btn{ display:none; }
  .side-drawer-close{ display:inline-flex; }
  .search-layout{ grid-template-columns:1fr; }
  .filters-panel{ position:fixed; left:0; right:0; bottom:0; top:auto; max-height:80vh; border-radius:18px 18px 0 0; transform:translateY(110%); transition:transform .2s ease; z-index:150; }
  .filters-panel.open{ transform:translateY(0); }
  .filter-toggle-btn{ display:inline-flex; }
  .hero-grid{ grid-template-columns:1fr; }
  .hero-visual{ order:-1; aspect-ratio:16/9; }
  .stats-banner{ grid-template-columns:1fr 1fr; }
  .dash-top{ grid-template-columns:1fr; }
  .jd-body{ grid-template-columns:1fr; }
  .jd-info-grid{ grid-template-columns:1fr 1fr; }
  .cv-layout{ grid-template-columns:1fr; }
  .msg-layout{ grid-template-columns:1fr; height:auto; }
  .thread-list{ max-height:220px; }
  .foot-grid{ grid-template-columns:1fr 1fr; }
  .kanban{ grid-template-columns:repeat(6,220px); }
}
@media (max-width: 720px){
  nav.pub-nav{ display:none; }
  .mobile-toggle{ display:inline-flex; }
  .grid2, .grid3, .grid4{ grid-template-columns:1fr; }
  .job-grid.cols2{ grid-template-columns:1fr; }
  .apptop-search{ display:none; }
  .content-pad{ padding:18px; }
  .stats-banner{ grid-template-columns:1fr 1fr; }
  .cand-row{ grid-template-columns:1fr; text-align:left; }
  .wrap{ padding:0 18px; }
}

}

var db;
function loadDB(cb){
  if(!SUPABASE_READY){
    try{
      var raw = window.localStorage.getItem(DB_KEY);
      db = raw ? JSON.parse(raw) : seedDB();
    }catch(e){ db = seedDB(); }
    db.session = null;
    cb && cb();
    return;
  }
  sb.from('app_state').select('data').eq('id','shared_state').maybeSingle().then(function(res){
    if(res.error){ throw res.error; }
    if(res.data && res.data.data){
      db = res.data.data;
    } else {
      db = seedDB();
      var toSave = Object.assign({}, db);
      delete toSave.session;
      sb.from('app_state').upsert({id:'shared_state', data:toSave}).then(function(){});
    }
    db.session = null;
    cb && cb();
  }).catch(function(err){
    console.error('Error cargando datos de Supabase:', err);
    db = seedDB();
    db.session = null;
    cb && cb();
  });
}
function saveDB(){
  if(!SUPABASE_READY){
    try{ window.localStorage.setItem(DB_KEY, JSON.stringify(db)); }catch(e){}
    return;
  }
  var toSave = Object.assign({}, db);
  delete toSave.session;
  sb.from('app_state').upsert({id:'shared_state', data:toSave}).then(function(res){
    if(res.error){
      console.error('Error guardando en Supabase:', res.error);
      showToast('No se pudo guardar en la nube (revisa tu configuracion de Supabase)');
    }
  });
}
function resetDB(){
  if(!confirm(SUPABASE_READY ? 'Restablecer los datos de demostracion para TODAS las personas que usan esta plataforma?' : 'Restablecer los datos de demostracion en este navegador?')) return;
  db = seedDB();
  var toSave = Object.assign({}, db);
  delete toSave.session;
  db.session = null;
  if(!SUPABASE_READY){
    try{ window.localStorage.setItem(DB_KEY, JSON.stringify(db)); }catch(e){}
  } else {
    sb.from('app_state').upsert({id:'shared_state', data:toSave}).then(function(){});
  }
  location.hash = '#/';
  render();
  showToast('Datos de demostracion restablecidos');
}

/* ---------------- helpers ---------------- */
function statusClass(s){ return 'status-'+String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,'-').toLowerCase(); }
function esc(s){ if(s===undefined||s===null) return ''; return String(s).replace(/[&<>"']/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function money(n){ return '$' + Number(n).toLocaleString('es-CO'); }
function companyOf(job){ return db.companies.find(function(c){return c.id===job.companyId;}); }
function jobById(id){ return db.jobs.find(function(j){return j.id===id;}); }
function candidateById(id){ return db.candidates.find(function(c){return c.id===id;}); }
function currentCandidate(){ return db.session && db.session.role==='candidate' ? candidateById(db.session.id) : null; }
function currentCompany(){ return db.session && db.session.role==='company' ? db.companies.find(function(c){return c.id===db.session.id;}) : null; }
function initials(a,b){ return ((a||' ')[0]+(b||' ')[0]).toUpperCase(); }
function go(hash){ location.hash = hash; window.scrollTo(0,0); }

var toastTimer=null;
function showToast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){t.classList.remove('show');},3000);
}
function closeDrawers(){
  document.getElementById('drawerOverlay').classList.remove('show');
  var sb=document.querySelector('aside.sidebar'); if(sb) sb.classList.remove('open');
  var fp=document.querySelector('.filters-panel'); if(fp) fp.classList.remove('open');
}
function openSidebar(){ document.getElementById('drawerOverlay').classList.add('show'); document.querySelector('aside.sidebar').classList.add('open'); }
function openFilters(){ document.getElementById('drawerOverlay').classList.add('show'); document.querySelector('.filters-panel').classList.add('open'); }

var sidebarCollapsed = false;
try{ sidebarCollapsed = window.localStorage.getItem('jobin_sidebar_collapsed')==='1'; }catch(e){}
function toggleSidebar(){
  var sb = document.querySelector('aside.sidebar');
  if(!sb) return;
  if(window.innerWidth <= 980){
    if(sb.classList.contains('open')) closeDrawers(); else openSidebar();
  } else {
    sidebarCollapsed = !sidebarCollapsed;
    try{ window.localStorage.setItem('jobin_sidebar_collapsed', sidebarCollapsed?'1':'0'); }catch(e){}
    render();
  }
}

/* ---------------- ring / progress ---------------- */
function ringSVG(pct, size, color){
  size = size||78; color = color || 'var(--accent)';
  var r=(size/2)-6, c=2*Math.PI*r, off=c*(1-pct/100);
  return '<div class="ring" style="width:'+size+'px;height:'+size+'px;">'+
    '<svg viewBox="0 0 '+size+' '+size+'"><circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" stroke="rgba(255,255,255,0.09)" stroke-width="6" fill="none"/>'+

function toggleSave(jobId){
  var cand = currentCandidate();
  if(!cand){ go('#/login'); return; }
  if(!db.savedJobs[cand.id]) db.savedJobs[cand.id]=[];
  var arr=db.savedJobs[cand.id]; var idx=arr.indexOf(jobId);
  if(idx===-1){ arr.push(jobId); showToast('Oferta guardada'); } else { arr.splice(idx,1); showToast('Oferta eliminada de guardados'); }
  saveDB(); render();
}

/* ================= ROUTER ================= */
function currentRoute(){
  var h = location.hash.replace(/^#/,'') || '/';
  var parts = h.split('/').filter(Boolean);
  return parts;
}
window.addEventListener('hashchange', render);
window.addEventListener('resize', function(){ closeDrawers(); });

function requireAuth(role){
  if(!db.session || db.session.role!==role){ go('#/login'); return false; }
  return true;
}

function render(){
  closeDrawers();
  var parts = currentRoute();
  var root = document.getElementById('root');
  var seg = parts[0] || '';
  var html = '';

  if(seg==='' ) html = layoutPublic(viewHome());
  else if(seg==='jobs') html = layoutPublic(viewJobs());
  else if(seg==='job') html = layoutPublic(viewJobDetail(parts[1]));
  else if(seg==='login') html = layoutAuth(viewLogin());
  else if(seg==='register') html = layoutAuth(viewRegister());
  else if(seg==='companies') html = layoutPublic(viewCompanies());
  else if(seg==='resources') html = layoutPublic(viewResources());
  else if(seg==='about') html = layoutPublic(viewAbout());
  else if(seg==='dashboard'){ if(!requireAuth('candidate'))return; html = layoutApp('candidate','dashboard', viewDashboard()); }
  else if(seg==='recommendations'){ if(!requireAuth('candidate'))return; html = layoutApp('candidate','recommendations', viewRecommendations()); }
  else if(seg==='profile'){ if(!requireAuth('candidate'))return; html = layoutApp('candidate','profile', viewProfile()); }
  else if(seg==='cv'){ if(!requireAuth('candidate'))return; html = layoutApp('candidate','cv', viewCV()); }
  else if(seg==='preferences'){ if(!requireAuth('candidate'))return; html = layoutApp('candidate','preferences', viewPreferences()); }
  else if(seg==='applications'){ if(!requireAuth('candidate'))return; html = layoutApp('candidate','applications', viewApplications()); }
  else if(seg==='messages'){ if(!db.session){go('#/login');return;} html = layoutApp(db.session.role,'messages', viewMessages(parts[1])); }
  else if(seg==='notifications'){ if(!db.session){go('#/login');return;} html = layoutApp(db.session.role,'notifications', viewNotifications()); }
  else if(seg==='settings'){ if(!db.session){go('#/login');return;} html = layoutApp(db.session.role,'settings', viewSettings()); }
  else if(seg==='candidate-search'){ if(!requireAuth('candidate'))return; html = layoutApp('candidate','jobs', viewJobsApp()); }
  else if(seg==='company'){ if(!requireAuth('company'))return; html = layoutApp('company','home', viewCompanyHome()); }
  else if(seg==='post-job'){ if(!requireAuth('company'))return; html = layoutApp('company','post-job', viewPostJob(parts[1])); }
  else if(seg==='my-jobs'){ if(!requireAuth('company'))return; html = layoutApp('company','my-jobs', viewMyJobs()); }
  else if(seg==='candidates'){ if(!requireAuth('company'))return; html = layoutApp('company','candidates', viewCandidates()); }
  else if(seg==='pipeline'){ if(!requireAuth('company'))return; html = layoutApp('company','pipeline', viewPipeline()); }
  else if(seg==='company-profile'){ if(!requireAuth('company'))return; html = layoutApp('company','company-profile', viewCompanyProfile()); }
  else if(seg==='company-stats'){ if(!requireAuth('company'))return; html = layoutApp('company','company-stats', viewCompanyStats()); }
  else if(seg==='admin') html = layoutApp('admin','admin', viewAdmin());
  else html = layoutPublic('<div class="wrap section"><div class="empty-state glass">'+icon('search',34)+'<strong>Página no encontrada</strong>Esa sección no existe.</div></div>');

  root.innerHTML = html;
  window.scrollTo(0,0);
  afterRenderHooks();
}

}

function filterGroup(title,name,opts){
  return '<details class="filter-group" open><summary>'+title+' '+icon('chevronDown',15)+'</summary><div class="filter-group-body">'+
    opts.map(function(o){return '<label class="checkline"><input type="checkbox" class="'+name+'" value="'+esc(o)+'" onchange="applyJobFilters()"> '+esc(o)+'</label>';}).join('')+
  '</div></details>';

function clearFilters(){
  document.querySelectorAll('.filters-panel input[type=checkbox]').forEach(function(c){c.checked=false;});
  document.getElementById('jq').value=''; document.getElementById('jloc').value=''; document.getElementById('jcat').value='';
  applyJobFilters();
}
function getChecked(name){ return Array.from(document.querySelectorAll('.'+name+':checked')).map(function(c){return c.value;}); }

function jobMatchesFilters(job){
  var q=(document.getElementById('jq')||{}).value||''; q=q.toLowerCase();
  var loc=(document.getElementById('jloc')||{}).value||'';
  var cat=(document.getElementById('jcat')||{}).value||'';
  var comp = companyOf(job);
  if(q && (job.title+' '+comp.nombre+' '+job.area+' '+job.habilidades.join(' ')).toLowerCase().indexOf(q)===-1) return false;
  if(loc && job.ubicacion.toLowerCase().indexOf(loc.toLowerCase())===-1) return false;
  if(cat && job.area!==cat) return false;
  var types=getChecked('fType'); if(types.length && types.indexOf(job.jornada)===-1 && !(types.indexOf('Por contrato')!==-1 && job.tipoContrato.indexOf('fijo')!==-1)) {
    if(types.indexOf(job.jornada)===-1) return false;
  }
  var mods=getChecked('fMod'); if(mods.length && mods.indexOf(job.modalidad)===-1) return false;
  var sals=getChecked('fSal'); if(sals.length){
    var ok = sals.some(function(s){
      if(s==='Menos de $2M') return job.salaryMax < 2000000;
      if(s==='$2M - $3M') return job.salaryMin < 3000000 && job.salaryMax >= 2000000;
      if(s==='$3M - $5M') return job.salaryMin < 5000000 && job.salaryMax >= 3000000;
      if(s==='Más de $5M') return job.salaryMax > 5000000;
    });
    if(!ok) return false;
  }
  var exps=getChecked('fExp'); if(exps.length && exps.indexOf(job.experiencia)===-1) return false;
  var edus=getChecked('fEdu'); if(edus.length && edus.indexOf(job.nivelEducativo)===-1) return false;
  var secs=getChecked('fSec'); if(secs.length && secs.indexOf(job.area)===-1) return false;
  return true;
}
var jobSort = 'relevantes';
function setSort(v){ jobSort='v'===v?v:v; jobSort=v; applyJobFilters(); }
function sortJobs(list){
  var l = list.slice();
  if(jobSort==='recientes') l.sort(function(a,b){return b.id.localeCompare(a.id);});
  else if(jobSort==='salario') l.sort(function(a,b){return b.salaryMax-a.salaryMax;});
  else if(jobSort==='match') l.sort(function(a,b){return b.match-a.match;});
  return l;
}
function applyJobFilters(){
  var list = db.jobs.filter(jobMatchesFilters);
  list = sortJobs(list);
  document.getElementById('jobResultsGrid').innerHTML = list.length ? list.map(function(j){return jobCardHTML(j);}).join('') :
    '<div class="empty-state glass">'+icon('search',34)+'<strong>No encontramos ofertas con esos filtros</strong>Prueba con otra palabra clave o quita algún filtro.</div>';
  document.getElementById('jobResultsCount').textContent = list.length + (list.length===1?' oferta encontrada':' ofertas encontradas');
}

function doLogin(){
  var email = (byId('li-email').value||'').trim().toLowerCase();
  var pass = byId('li-pass').value||'';
  if(!email || !pass){ authError='Ingresa tu correo y tu contraseña.'; render(); return; }

  if(SUPABASE_READY){
    sb.auth.signInWithPassword({email:email, password:pass}).then(function(res){
      if(res.error){ authError = translateSupabaseError(res.error); render(); return; }
      var uid = res.data.user.id;
      var profile = authRole==='candidate'
        ? db.candidates.find(function(c){return c.id===uid;})
        : db.companies.find(function(c){return c.id===uid;});
      if(!profile){
        authError='Esa cuenta existe pero no como '+(authRole==='candidate'?'candidato':'empresa')+'. Prueba con el otro tipo de cuenta.';
        render();
        return;
      }
      db.session = {role:authRole, id:uid};
      authError='';
      showToast('Sesion iniciada');
      go(authRole==='candidate' ? '#/dashboard' : '#/company');
    });
    return;
  }

  if(authRole==='candidate'){
    var cand = db.candidates.find(function(c){ return (c.email||'').toLowerCase()===email; });
    if(!cand || (cand.password||'')!==pass){ authError='No encontramos una cuenta de candidato con ese correo y contraseña.'; render(); return; }
    db.session = {role:'candidate', id:cand.id};
  } else {
    var comp = db.companies.find(function(c){ return (c.correo||'').toLowerCase()===email; });
    if(!comp || (comp.password||'')!==pass){ authError='No encontramos una cuenta de empresa con ese correo y contraseña.'; render(); return; }
    db.session = {role:'company', id:comp.id};
  }
  authError='';
  saveDB();
  showToast('Sesión iniciada');
  go(authRole==='candidate' ? '#/dashboard' : '#/company');
}

    if(!nombre || !apellido){ authError='Ingresa tu nombre y apellido.'; render(); return; }
    if(!email){ authError='Ingresa un correo electrónico.'; render(); return; }
    if(!SUPABASE_READY && db.candidates.some(function(c){return (c.email||'').toLowerCase()===email;})){ authError='Ya existe una cuenta de candidato con ese correo. Intenta iniciar sesión.'; render(); return; }
    if(!p1 || p1.length<6){ authError='La contraseña debe tener al menos 6 caracteres.'; render(); return; }
    if(p1!==p2){ authError='Las contraseñas no coinciden.'; render(); return; }

    var candData = function(id){ return {
      id:id, nombre:nombre, apellido:apellido, email:email, ciudad:ciudad||'Sin especificar', telefono:telefono,
      cargo:'Sin especificar', sobreMi:'Aún no has agregado una descripción de tu perfil.', perfilCompletado:25,
      experiencia:[], educacion:[], habilidades:[], idiomas:[], certificaciones:[], portafolio:[],
      preferencias:{ tipoEmpleo:'Tiempo completo', experiencia:'', salarioEsperado:'', sectores:[], horario:'', ciudad:ciudad||'', distancia:'', remoto:false, hibrido:false, presencial:true, notifJobs:true, notifMensajes:true, notifEmail:false, perfilPublico:true }
    }; };

    if(SUPABASE_READY){
      sb.auth.signUp({email:email, password:p1}).then(function(res){
        if(res.error || !res.data.user){ authError = translateSupabaseError(res.error || {message:'No se pudo crear la cuenta.'}); render(); return; }
        var newCand = candData(res.data.user.id);
        db.candidates.push(newCand);
        db.session = {role:'candidate', id:newCand.id};
        authError='';
        saveDB();
        showToast('Cuenta creada. Bienvenido a Job-In!');
        go('#/dashboard');
      });
      return;
    }
    var newCand = candData('cand'+Date.now());
    newCand.password = p1;
    db.candidates.push(newCand);
    db.session = {role:'candidate', id:newCand.id};
  } else {
    var cnombre=byId('re-nombre').value.trim();
    var cemail=byId('re-email').value.trim().toLowerCase();
    var p3=byId('rp3').value;
    var ctelefono=byId('re-telefono').value.trim(), cciudad=byId('re-ciudad').value.trim(), sector=byId('re-sector').value;
    if(!cnombre){ authError='Ingresa el nombre de tu empresa.'; render(); return; }
    if(!cemail){ authError='Ingresa un correo empresarial.'; render(); return; }
    if(!SUPABASE_READY && db.companies.some(function(c){return (c.correo||'').toLowerCase()===cemail;})){ authError='Ya existe una cuenta de empresa con ese correo. Intenta iniciar sesión.'; render(); return; }
    if(!p3 || p3.length<6){ authError='La contraseña debe tener al menos 6 caracteres.'; render(); return; }

    var compData = function(id){ return {
      id:id, nombre:cnombre, correo:cemail, telefono:ctelefono, ciudad:cciudad||'Sin especificar', sector:sector,
      verificada:false, descripcion:'Esta empresa aún no ha completado su descripción.', empleados:'Por definir', fundacion:'Por definir', sitio:''
    }; };

    if(SUPABASE_READY){
      sb.auth.signUp({email:cemail, password:p3}).then(function(res){
        if(res.error || !res.data.user){ authError = translateSupabaseError(res.error || {message:'No se pudo crear la cuenta.'}); render(); return; }
        var newComp = compData(res.data.user.id);
        db.companies.push(newComp);
        db.session = {role:'company', id:newComp.id};
        authError='';
        saveDB();
        showToast('Cuenta creada. Bienvenido a Job-In!');
        go('#/company');
      });
      return;
    }
    var newComp = compData('comp'+Date.now());
    newComp.password = p3;
    db.companies.push(newComp);
    db.session = {role:'company', id:newComp.id};
  }
  authError='';
  saveDB();
  showToast('Cuenta creada. ¡Bienvenido a Job-In!');
  go(authRole==='candidate' ? '#/dashboard' : '#/company');
}

var openThreadId = null;
function viewMessages(threadParam){
  var role = db.session.role;
  var myThreads = db.threads.filter(function(t){ return role==='candidate' ? t.candidateId===db.session.id : t.companyId===db.session.id; });
  if(threadParam) openThreadId = threadParam;
  if(!openThreadId && myThreads.length) openThreadId = myThreads[0].id;
  var thread = myThreads.find(function(t){return t.id===openThreadId;});
  return '<div class="section-head"><h2>Mensajes</h2></div>'+
  '<div class="msg-layout glass">'+
    '<div class="thread-list">'+myThreads.map(function(t){
      var other = role==='candidate' ? companyOf({companyId:t.companyId}) : candidateById(t.candidateId);
      var otherName = role==='candidate' ? db.companies.find(function(c){return c.id===t.companyId;}).nombre : (other.nombre+' '+(other.apellido||''));
      var last = t.messages[t.messages.length-1];
      return '<div class="thread-item '+(t.id===openThreadId?'active':'')+'" onclick="openThreadId=\''+t.id+'\';render()"><div class="avatar">'+otherName[0]+'</div><div style="min-width:0;"><div class="name">'+esc(otherName)+'</div><div class="preview">'+esc(last?last.text:'')+'</div></div></div>';
    }).join('') + (!myThreads.length?'<div class="empty-state">'+icon('message',28)+'<strong>Sin conversaciones</strong></div>':'')+'</div>'+
    '<div class="chat-col">'+
      (thread ? renderChat(thread, role) : '<div class="empty-state" style="margin:auto;">'+icon('message',30)+'<strong>Selecciona una conversación</strong></div>')+
    '</div>'+
  '</div>';
}
function renderChat(thread, role){
  var otherName = role==='candidate' ? db.companies.find(function(c){return c.id===thread.companyId;}).nombre : (function(){var c=candidateById(thread.candidateId); return c.nombre+' '+c.apellido;})();
  return '<div class="chat-head"><div class="avatar">'+otherName[0]+'</div><div style="font-weight:700;">'+esc(otherName)+'</div></div>'+
    '<div class="chat-body" id="chatBody">'+thread.messages.map(function(m){
      var mine = (role==='candidate' && m.from==='candidate') || (role==='company' && m.from==='company');
      return '<div class="bubble '+(mine?'me':'them')+'">'+esc(m.text)+'<span class="time">'+esc(m.fecha)+'</span></div>';
    }).join('')+'</div>'+
    '<div class="chat-input"><button class="icon-btn">'+icon('paperclip',18)+'</button><input id="chatInput" placeholder="Escribe un mensaje…" onkeydown="if(event.key===\'Enter\')sendMessage(\''+thread.id+'\')"><button class="btn btn-primary btn-sm" onclick="sendMessage(\''+thread.id+'\')">'+icon('send',15)+'</button></div>';
}
function sendMessage(threadId){
  var input = document.getElementById('chatInput');
  var text = input.value.trim(); if(!text) return;
  var thread = db.threads.find(function(t){return t.id===threadId;});
  var role = db.session.role;
  thread.messages.push({from:role, text:text, fecha:'Ahora'});
  saveDB();
  input.value='';
  render();
}

var pipelineStages = [
  ['nuevas','Nuevas postulaciones'],['revision','En revisión'],['preseleccion','Preseleccionados'],
  ['entrevista','Entrevista'],['oferta','Oferta'],['contratado','Contratado']
];
function viewPipeline(){
  var comp = currentCompany();
  var myJobIds = db.jobs.filter(function(j){return j.companyId===comp.id;}).map(function(j){return j.id;});
  var apps = db.applications.filter(function(a){return myJobIds.indexOf(a.jobId)!==-1;});
  return '<div class="section-head"><h2>Panel de reclutamiento</h2><span class="muted">Mueve a los candidatos entre etapas</span></div>'+
  '<div class="kanban">'+pipelineStages.map(function(st){
    var items = apps.filter(function(a){return a.etapa===st[0];});
    return '<div class="kb-col"><h5>'+st[1]+' <span>'+items.length+'</span></h5>'+
      items.map(function(a){
        var cand = candidateById(a.candidateId); var job = jobById(a.jobId);
        var idx = pipelineStages.findIndex(function(s){return s[0]===st[0];});
        return '<div class="kb-card glass"><div class="name">'+esc(cand.nombre)+' '+esc(cand.apellido||'')+'</div><div class="role">'+esc(job.title)+'</div>'+
          '<div class="move-row">'+
            (idx>0?'<button onclick="moveStage(\''+a.id+'\',-1)">◀</button>':'')+
            (idx<pipelineStages.length-1?'<button onclick="moveStage(\''+a.id+'\',1)">▶</button>':'')+
          '</div></div>';
      }).join('')+
    '</div>';
  }).join('')+'</div>';
}
function moveStage(appId, dir){
  var a = db.applications.find(function(x){return x.id===appId;});
  var idx = pipelineStages.findIndex(function(s){return s[0]===a.etapa;});
  var newIdx = Math.min(pipelineStages.length-1, Math.max(0, idx+dir));
  a.etapa = pipelineStages[newIdx][0];
  var statusMap = {nuevas:'Enviada',revision:'En revisión',preseleccion:'Preseleccionado',entrevista:'Entrevista',oferta:'Seleccionado',contratado:'Contratado'};
  a.estado = statusMap[a.etapa];
  saveDB(); render(); showToast('Candidato movido a "'+pipelineStages[newIdx][1]+'"');
}

function viewCompanyStats(){
  var comp = currentCompany();
  var myJobIds = db.jobs.filter(function(j){return j.companyId===comp.id;}).map(function(j){return j.id;});
  var apps = db.applications.filter(function(a){return myJobIds.indexOf(a.jobId)!==-1;});
  var byStage = {};
  pipelineStages.forEach(function(s){ byStage[s[0]] = apps.filter(function(a){return a.etapa===s[0];}).length; });
  var maxV = Math.max.apply(null, Object.values(byStage).concat([1]));
  var views = [120,98,140,76,110,64];
  var maxViews = Math.max.apply(null,views);
  return '<div class="section-head"><h2>Estadísticas</h2></div>'+
  '<div class="grid4">'+
    '<div class="kpi-card glass"><div class="num">'+views.reduce(function(a,b){return a+b;},0)+'</div><div class="lbl">Visualizaciones de oferta</div><div class="delta">↑ 12% esta semana</div></div>'+
    '<div class="kpi-card glass"><div class="num">'+apps.length+'</div><div class="lbl">Postulaciones</div><div class="delta">↑ 8% esta semana</div></div>'+
    '<div class="kpi-card glass"><div class="num">'+(apps.length? Math.round(100*(byStage.contratado||0)/apps.length):0)+'%</div><div class="lbl">Tasa de conversión</div></div>'+
    '<div class="kpi-card glass"><div class="num">12 días</div><div class="lbl">Tiempo promedio de contratación</div></div>'+
  '</div>'+
  '<div class="grid2" style="margin-top:20px;align-items:start;">'+
    '<div class="glass" style="padding:22px;"><h4>Candidatos por etapa</h4><div class="bars">'+pipelineStages.map(function(s){
      var v = byStage[s[0]]; var h = Math.max(6, Math.round((v/maxV)*140));
      return '<div class="bar-col"><div class="bar-fill" style="height:'+h+'px;"></div><div class="bar-lbl">'+s[1].split(' ')[0]+'</div></div>';
    }).join('')+'</div></div>'+
    '<div class="glass" style="padding:22px;"><h4>Fuentes de candidatos</h4><div class="hbars" style="margin-top:14px;">'+
      [['Búsqueda en Job-In',62],['Recomendaciones',21],['Referidos',11],['Otros',6]].map(function(s){
        return '<div class="hbar-row"><span class="muted">'+s[0]+'</span><div class="hbar-track"><div class="hbar-fill" style="width:'+s[1]+'%;"></div></div><span>'+s[1]+'%</span></div>';
      }).join('')+'</div></div>'+
  '</div>'+
  '<div class="glass" style="padding:22px;margin-top:16px;"><h4>Visualizaciones de la oferta (últimos 6 días)</h4><div class="bars" style="height:120px;">'+views.map(function(v,i){
    var h = Math.max(6, Math.round((v/maxViews)*100));
    return '<div class="bar-col"><div class="bar-fill" style="height:'+h+'px;"></div><div class="bar-lbl">Día '+(i+1)+'</div></div>';
  }).join('')+'</div></div>';
}

/* ================= ADMIN ================= */
function viewAdmin(){
  var totalUsers = db.candidates.length, totalComp = db.companies.length, totalJobs = db.jobs.length;
  return '<div class="section-head"><h2>Panel administrativo — Job-In</h2></div>'+
  '<div class="grid4">'+
    '<div class="kpi-card glass"><div class="num">'+totalUsers+'</div><div class="lbl">Usuarios candidatos</div></div>'+
    '<div class="kpi-card glass"><div class="num">'+totalComp+'</div><div class="lbl">Empresas registradas</div></div>'+
    '<div class="kpi-card glass"><div class="num">'+totalJobs+'</div><div class="lbl">Ofertas publicadas</div></div>'+
    '<div class="kpi-card glass"><div class="num">'+db.applications.length+'</div><div class="lbl">Postulaciones totales</div></div>'+
  '</div>'+
  '<div class="section-head" style="margin-top:26px;"><h4 style="font-family:var(--font-d);">Empresas</h4></div>'+
  '<div class="glass" style="padding:8px 20px;">'+db.companies.map(function(c){
    return '<div class="row between" style="padding:13px 0;border-bottom:1px solid var(--border);"><div class="row gap12"><div class="job-logo" style="width:36px;height:36px;">'+esc(c.nombre[0])+'</div><span>'+esc(c.nombre)+'</span>'+(c.verificada?'<span class="badge-verified">'+icon('verified',12)+' Verificada</span>':'<span class="muted" style="font-size:0.78rem;">Sin verificar</span>')+'</div>'+
    '<div class="row gap8"><button class="btn btn-ghost btn-sm" onclick="toggleVerify(\''+c.id+'\')">'+(c.verificada?'Quitar verificación':'Verificar')+'</button><button class="btn btn-danger btn-sm" onclick="showToast(\'Empresa reportada para revisión (demo)\')">Moderar</button></div></div>';
  }).join('')+'</div>'+
  '<div class="section-head" style="margin-top:26px;"><h4 style="font-family:var(--font-d);">Ofertas publicadas</h4></div>'+
  '<div class="glass" style="padding:8px 20px;">'+db.jobs.map(function(j){
    var c = companyOf(j);
    return '<div class="row between" style="padding:13px 0;border-bottom:1px solid var(--border);"><span>'+esc(j.title)+' <span class="muted" style="font-size:0.8rem;">· '+esc(c.nombre)+'</span></span><div class="row gap8"><button class="btn btn-ghost btn-sm" onclick="go(\'#/job/'+j.id+'\')">Ver</button><button class="btn btn-danger btn-sm" onclick="removeJob(\''+j.id+'\');render()">Eliminar</button></div></div>';
  }).join('')+'</div>'+
  '<div class="section-head" style="margin-top:26px;"><h4 style="font-family:var(--font-d);">Categorías</h4></div>'+
  '<div class="row gap8" style="flex-wrap:wrap;">'+['Tecnología','Marketing','Diseño','Administración','Ingeniería','Salud','Educación','Ventas'].map(function(c){return '<span class="tag">'+c+'</span>';}).join('')+'<button class="btn btn-ghost btn-sm" onclick="showToast(\'Categoría agregada (demo)\')">'+icon('plus',13)+' Nueva categoría</button></div>';
}
function toggleVerify(id){ var c=db.companies.find(function(x){return x.id===id;}); c.verificada=!c.verificada; saveDB(); render(); }

/* ================= INIT ================= */
if(!location.hash) location.hash = '#/';
loadDB(function(){
  if(SUPABASE_READY){
    sb.auth.onAuthStateChange(function(event, session){
      var uid = session && session.user && session.user.id;
      if(uid){
        var cand = db.candidates.find(function(c){return c.id===uid;});
        var comp = db.companies.find(function(c){return c.id===uid;});
        if(cand) db.session = {role:'candidate', id:uid};
        else if(comp) db.session = {role:'company', id:uid};
        else db.session = null;
      } else {
        db.session = null;
      }
      render();
    });
  } else {
    render();
  }
});
</script>
</body>
</html>
